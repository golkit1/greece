      <button id="btnDark" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg transition-all" title="מצב כהה">

    </div>

    <i data-lucide="search" class="w-4 h-4 absolute right-3 top-2.5 text-sky-200"></i>
  </div>
  <div id="searchResults" class="search-results hidden mt-2 bg-white text-slate-800 rounded-lg shadow-xl overflow-hidden dark:bg-slate-800 dark:text-slate-100"></div>

</main>

  { cat:"הליכה והרים", key:"hike", items:["נעלי טיולים גבוהות","שכבות — קל, פליז, מעיל רוח/גשם","תיק יום 20–30 ליטר","מקלות הליכה","פנס ראש","כפפות וכובע גרב","שק שינה קל (למקלט אסטרקה)"] },
  { cat:"נהיגה ומסמכים", key:"drive", items:["רישיון נהיגה בינלאומי","אישור רכב שכור והדפסות","ביטוח נסיעות מודפס","מטען/מתאם לרכב","כרטיס אשראי + מזומן ביורו"] },
  { cat:"כללי", key:"gen", items:["מטען נייד + כבלים","קרם הגנה","ערכת עזרה ראשונה קטנה","בגד ים (לחוף במאני)","בקבוק מים לשימוש חוזר"] }
];

const budgetRows = [
  {key:"flights", label:"טיסות", note:"הלוך ושוב, לשני נוסעים"},
  {key:"car", label:"רכב שכור", note:"16 ימים, הילוכים ידניים"},
  {key:"fuel", label:"דלק וכבישי אגרה", note:"מסלול מלא (TollGuru: אגרות €76.65 + דלק €279.91)", def:1241},
  {key:"stay", label:"לינה", note:"כולל מקלט אסטרקה"},
  {key:"food", label:"אוכל", note:"ל־16 יום"},
  {key:"insurance", label:"ביטוח נסיעות", note:"כולל כיסוי טרקים"},
  {key:"misc", label:"שונות", note:"כניסות, ציוד, בלת\"מים"}
];

// ==================================================
// STORAGE (window.storage instead of localStorage)
// ==================================================
let visited = {};
let packChecked = {};
let budgetValues = {};
let darkMode = false;

async function loadState(){
  try{ const r = await window.storage.get('visited-stations'); if(r) visited = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('pack-checked'); if(r) packChecked = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('budget-values'); if(r) budgetValues = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('dark-mode'); if(r) darkMode = r.value === 'true'; }catch(e){}
}
async function saveVisited(){ try{ await window.storage.set('visited-stations', JSON.stringify(visited)); }catch(e){} }
async function savePack(){ try{ await window.storage.set('pack-checked', JSON.stringify(packChecked)); }catch(e){} }
async function saveBudget(){ try{ await window.storage.set('budget-values', JSON.stringify(budgetValues)); }catch(e){} }
async function saveDark(){ try{ await window.storage.set('dark-mode', String(darkMode)); }catch(e){} }

// ==================================================
// RENDER: HOME
// ==================================================
function renderHome(){
  const start = new Date("2026-10-04T00:00:00");
  const end = new Date("2026-10-19T23:59:59");
  const now = new Date();
  const card = document.getElementById('countdownCard');
  const diffDays = Math.ceil((start - now) / 86400000);
  if(now < start){
    card.innerHTML = `<div class="text-sm text-sky-100 mb-1">עד הטיול</div>
      <div class="text-4xl font-black">${diffDays} ימים</div>
      <div class="text-sm text-sky-100 mt-2">יוצאים 4.10.2026 ליואנינה</div>`;
  } else if(now >= start && now <= end){
    card.innerHTML = `<div class="text-sm text-sky-100 mb-1">אתם בטיול!</div>
      <div class="text-2xl font-black">בהצלחה ותיהנו 🇬🇷</div>`;
  } else {
    card.innerHTML = `<div class="text-sm text-sky-100 mb-1">הטיול הסתיים</div>
      <div class="text-2xl font-black">תודה שהשתמשתם באפליקציה!</div>`;
  }
}

// ==================================================
// RENDER: ITINERARY
// ==================================================
function stationRow(dayId, idx, st){
  const key = `d${dayId}-s${idx}`;
  const checked = visited[key] ? 'checked' : '';
  const done = visited[key] ? 'opacity-40 line-through' : '';
  let navHtml = '';
  if(st.place){
    const p = places[st.place];
    const links = navLinks(p.lat, p.lon, p.name);
    navHtml = `<div class="flex gap-2 mt-2">
      <a href="${links.mapy}" target="_blank" rel="noopener" class="text-xs font-semibold text-greekBlue dark:text-sky-400 hover:underline">נווט אל: ${p.name}</a>
      <a href="${links.om}" target="_blank" rel="noopener" class="text-[10px] font-bold text-white bg-zagoria px-1.5 py-0.5 rounded">OM</a>
    </div>`;
  }
  const dur = st.duration ? `<span class="text-xs font-bold text-rust">⏱ ${st.duration}</span>` : '';
  return `<div class="flex gap-3 relative z-10 pb-4 last:pb-0">
    <input type="checkbox" ${checked} onchange="toggleStation(${dayId},${idx})" class="w-5 h-5 mt-0.5 rounded border-stone-300 shrink-0 cursor-pointer">
    <div class="${done} flex-1">
      <div class="flex items-baseline gap-2 flex-wrap">
        <span class="font-bold text-sm">${st.title}</span>${dur}
      </div>
      <p class="text-xs opacity-70 mt-1">${st.desc}</p>
      ${navHtml}
    </div>
  </div>`;
}

function dayCard(day){
  const overnight = day.overnight ? `<span class="text-[11px] font-bold bg-stone-100 dark:bg-slate-700 px-2.5 py-1 rounded-full">🌙 ${day.overnight}</span>` : '';
  const stations = day.stations.map((s,i)=>stationRow(day.id,i,s)).join('');
  return `<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-stone-200 dark:border-slate-700 p-5" id="day-${day.id}">
    <div class="flex justify-between items-center flex-wrap gap-2">
      <span class="text-xs font-bold text-greekBlue dark:text-sky-400">${day.date}</span>
      ${overnight}
    </div>
    <h3 class="text-lg font-bold mt-2 text-greekDark dark:text-slate-100">${day.route}</h3>
    <p class="text-sm italic opacity-70 mt-2 border-r-2 border-rust pr-3">${day.quote}</p>
    <div class="timeline-line mt-4 pr-0">${stations}</div>
  </div>`;
}

function renderItinerary(leg){
  const wrap = document.getElementById('dayCards');
  wrap.innerHTML = tripDays.filter(d=>d.leg===leg).map(dayCard).join('');
  lucide.createIcons();
}

function toggleStation(dayId, idx){
  const key = `d${dayId}-s${idx}`;
  visited[key] = !visited[key];
  saveVisited();
  const activeLeg = document.querySelector('.leg-btn[data-active="1"]')?.dataset.leg || 'zagoria';
  renderItinerary(activeLeg);
}

document.getElementById('legTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.leg-btn');
  if(!btn) return;
  document.querySelectorAll('.leg-btn').forEach(b=>{
    b.classList.remove('bg-greekBlue','text-white');
    b.classList.add('bg-stone-100','text-slate-700');
    b.removeAttribute('data-active');
  });
  btn.classList.add('bg-greekBlue','text-white');
  btn.classList.remove('bg-stone-100','text-slate-700');
  btn.dataset.active = "1";
  renderItinerary(btn.dataset.leg);
});

// ==================================================
// RENDER: MAP
// ==================================================
document.getElementById('routeMap').addEventListener('click', (e)=>{
  const pin = e.target.closest('.pin');
  if(!pin) return;
  const p = places[pin.dataset.info];
  const links = navLinks(p.lat, p.lon, p.name);
  document.getElementById('mapInfo').innerHTML = `
    <span class="flex-1 min-w-[180px]"><b class="text-rust">${p.name}</b> — ${p.text}</span>
    <a href="${links.mapy}" target="_blank" rel="noopener" class="text-xs font-bold bg-greekBlue text-white px-3 py-1.5 rounded-full">נווט ב-Mapy ↗</a>
    <a href="${links.om}" target="_blank" rel="noopener" class="text-xs font-bold bg-zagoria text-white px-3 py-1.5 rounded-full">Organic Maps ↗</a>`;
});

// ==================================================
// RENDER: BUDGET
// ==================================================
function renderBudget(){
  const rows = budgetRows.map(r=>{
    const val = budgetValues[r.key] ?? r.def ?? '';
    return `<div class="grid grid-cols-[1fr_120px] items-center gap-3 p-4 border-b border-stone-100 dark:border-slate-700 last:border-0">
      <div>
        <div class="font-semibold text-sm">${r.label}</div>
        <div class="text-xs opacity-60 mt-0.5">${r.note}</div>
      </div>
      <input type="number" min="0" data-key="${r.key}" value="${val}" placeholder="0"
        class="budget-input w-full text-left px-2 py-2 rounded-lg border border-stone-200 dark:border-slate-600 bg-stone-50 dark:bg-slate-900 text-sm">
    </div>`;
  }).join('');
  const total = budgetRows.reduce((s,r)=> s + (Number(budgetValues[r.key] ?? r.def ?? 0)), 0);
  document.getElementById('budgetTable').innerHTML = rows + `
    <div class="flex justify-between items-center p-4 bg-greekBlue text-white">
      <span class="font-semibold">סה"כ</span>
      <span class="text-xl font-black" id="budgetTotal">₪${total.toLocaleString('he-IL')} <small class="font-normal text-sm opacity-80">ל־2 נוסעים</small></span>
    </div>`;
  document.querySelectorAll('.budget-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      budgetValues[inp.dataset.key] = Number(inp.value) || 0;
      saveBudget();
      const t = budgetRows.reduce((s,r)=> s + (Number(budgetValues[r.key] ?? r.def ?? 0)), 0);
      document.getElementById('budgetTotal').innerHTML = `₪${t.toLocaleString('he-IL')} <small class="font-normal text-sm opacity-80">ל־2 נוסעים</small>`;
    });
  });
}

// ==================================================
// RENDER: PACKING
// ==================================================
function renderPacking(){
  document.getElementById('packingGrid').innerHTML = packingData.map(cat=>{
    const items = cat.items.map((it,i)=>{
      const key = `${cat.key}-${i}`;
      const checked = packChecked[key] ? 'checked' : '';
      const done = packChecked[key] ? 'line-through opacity-40' : '';
      return `<label class="flex items-center gap-2.5 py-1.5 cursor-pointer text-sm">
        <input type="checkbox" ${checked} onchange="togglePack('${key}')" class="w-4 h-4 rounded">
        <span class="${done}">${it}</span>
      </label>`;
    }).join('');
    const total = cat.items.length;
    const done = cat.items.filter((_,i)=>packChecked[`${cat.key}-${i}`]).length;
    return `<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-stone-200 dark:border-slate-700 p-5">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-sm">${cat.cat}</h3>
        <span class="text-xs opacity-50">${done}/${total}</span>
      </div>
      ${items}
    </div>`;
  }).join('');
}
function togglePack(key){
  packChecked[key] = !packChecked[key];
  savePack();
  renderPacking();
}

// ==================================================
// SEARCH
// ==================================================
document.getElementById('globalSearch').addEventListener('input', (e)=>{
  const q = e.target.value.trim();
  const box = document.getElementById('searchResults');
  if(q.length < 2){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const results = [];
  tripDays.forEach(day=>{
    day.stations.forEach((st,i)=>{
      if((st.title+st.desc).includes(q)){
        results.push({day, st, i});
      }
    });
  });
  if(results.length === 0){
    box.innerHTML = `<div class="p-3 text-sm opacity-60">אין תוצאות</div>`;
  } else {
    box.innerHTML = results.map(r=>`
      <button class="w-full text-right p-3 border-b border-stone-100 dark:border-slate-700 hover:bg-stone-50 dark:hover:bg-slate-700 last:border-0"
        onclick="jumpToStation(${r.day.id}, '${r.day.leg}')">
        <div class="font-semibold text-sm">${r.st.title}</div>
        <div class="text-xs opacity-60">${r.day.route} · ${r.day.date}</div>
      </button>`).join('');
  }
  box.classList.remove('hidden');
});
function jumpToStation(dayId, leg){
  document.getElementById('globalSearch').value = '';
  document.getElementById('searchResults').classList.add('hidden');
  switchTab('itinerary');
  document.querySelector(`.leg-btn[data-leg="${leg}"]`).click();
  setTimeout(()=>{
    const el = document.getElementById(`day-${dayId}`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}

// ==================================================
// TABS
// ==================================================
function switchTab(tabId){
  document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tabId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active-tab'));
  const btn = document.getElementById('btn-'+tabId);
  if(btn) btn.classList.add('active-tab');
  window.scrollTo(0,0);
}

// ==================================================
// DARK MODE + DOWNLOAD
// ==================================================
document.getElementById('btnDark').addEventListener('click', async ()=>{
  darkMode = !darkMode;
  document.documentElement.classList.toggle('dark', darkMode);
  document.getElementById('btnDark').innerHTML = darkMode ? '<i data-lucide="sun" class="w-5 h-5"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>';
  lucide.createIcons();
  await saveDark();
});

document.getElementById('btnDownload').addEventListener('click', ()=>{
  const htmlContent = document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'טיול-יוון-2026.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ==================================================
// INIT
// ==================================================
(async function init(){
  await loadState();
  document.documentElement.classList.toggle('dark', darkMode);
  if(darkMode) document.getElementById('btnDark').innerHTML = '<i data-lucide="sun" class="w-5 h-5"></i>';
  document.querySelector('.leg-btn[data-leg="zagoria"]').dataset.active = "1";
  renderHome();
  renderItinerary('zagoria');
  renderBudget();
  renderPacking();
  switchTab('home');
  lucide.createIcons();
})();
</script>
</body>
</html>
